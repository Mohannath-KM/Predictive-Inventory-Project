services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fba_postgres
    environment:
      POSTGRES_USER: fba_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: fba_inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Redis for Concurrency Locking
  redis:
    image: redis:7-alpine
    container_name: fba_redis
    ports:
      - "6379:6379"

  # 3. Apache Kafka (KRaft Mode)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: fba_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFERS_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_STATUS_REPLICATION_FACTOR: 1
      KAFKA_COMPACT_LOG_MIN_CLEANABLE_RATIO: '0.3'
      KAFKA_ENV_LATEST_COMPATIBILITY_MODE: 'true'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # 4. FastAPI Inventory API
  api:
    build: .
    container_name: fba_inventory_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fba_admin:password123@postgres:5432/fba_inventory
      - REDIS_HOST=redis
      - KAFKA_SERVERS=kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka

volumes:
  pgdata: